<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <!-- iPad: Querformat, keine Zoom-Gesten, Bereich unter Kamera/Ecken nutzen (Safe Areas) -->
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Tankstelle">
  <meta name="theme-color" content="#1e2832">
  <meta name="format-detection" content="telephone=no">
  <title>Tankstellenkasse – Simulation</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
  <link rel="stylesheet" href="css/pos.css">
</head>
<body class="touch">
  <!-- Start per Doppelklick (file://, Desktop) oder als Home-Bildschirm-App über HTTPS. Keine externen Ressourcen. -->
  <header id="topbar">
    <div class="tb-brand">TANKSTELLE<span> · SIMULATION</span></div>
    <div id="topbar-status" class="tb-status"></div>
    <div class="tb-right">
      <span id="offline-pill" class="pill" role="status">Offline prüfen</span>
      <button type="button" id="nav-logout" class="btn small">Abmelden</button>
    </div>
  </header>

  <div id="backup-note" class="backup-note" role="status" hidden></div>

  <div id="update-banner" class="update-banner" role="status" hidden>
    <span>Eine neue Version ist bereit. Die Aktualisierung wird erst auf Ihre Bestätigung übernommen.</span>
    <button type="button" id="update-later" class="btn">Später</button>
    <button type="button" id="update-now" class="btn primary">Jetzt aktualisieren</button>
  </div>

  <div id="body">
    <nav id="rail" aria-label="Hauptbereiche">
      <button type="button" id="nav-kasse" class="rail-btn active">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 3h14v18H5z M8 7h8 M8 11h8 M8 15h5" /></svg><span>Kasse</span></button>
      <button type="button" id="nav-pumps" class="rail-btn">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 21V5h8v16 M4 21h12 M14 9h2l3 3v6a1.5 1.5 0 0 0 3 0V8l-2-2" /></svg><span>Zapfsäulen</span></button>
      <button type="button" id="nav-shop" class="rail-btn">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 8h16l-1.5 12h-13z M8 8V6a4 4 0 0 1 8 0v2" /></svg><span>Shop</span></button>
      <button type="button" id="nav-admin" class="rail-btn">
        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="3" /><path d="M12 2v3 M12 19v3 M2 12h3 M19 12h3 M4.9 4.9l2.1 2.1 M17 17l2.1 2.1 M4.9 19.1L7 17 M17 7l2.1-2.1" /></svg><span>Verwaltung</span></button>
    </nav>

    <main>
      <div id="view-kasse"></div>
      <div id="view-pumps" hidden></div>
      <div id="view-shop" hidden></div>
      <div id="view-admin" hidden></div>
      <div id="view-board" class="board-view" hidden></div>
    </main>
  </div>

  <div id="login-root" class="login-root" hidden></div>
  <div id="modal-root"></div>
  <div id="toasts" aria-live="polite"></div>
  <div id="print-area" aria-hidden="true"></div>

  <noscript>JavaScript ist erforderlich.</noscript>

  <!-- Reihenfolge ist wichtig: Kern -> Daten -> Hardware -> Oberfläche -> Start -->
  <script src="js/core/money.js"></script>
  <script src="js/core/ean.js"></script>
  <script src="js/core/fuel.js"></script>
  <script src="js/core/rules.js"></script>
  <script src="js/core/automat.js"></script>
  <script src="js/core/sim.js"></script>
  <script src="js/core/traffic.js"></script>
  <script src="js/core/cart.js"></script>
  <script src="js/core/training.js"></script>
  <script src="js/core/ledger.js"></script>
  <script src="js/core/pumps.js"></script>
  <script src="js/data/seed.js"></script>
  <script src="js/data/store.js"></script>
  <script src="js/data/reports.js"></script>
  <script src="js/hw/scanner.js"></script>
  <script src="js/hw/sound.js"></script>
  <script src="js/hw/printer.js"></script>
  <script src="js/ui/ui.js"></script>
  <script src="js/ui/board.js"></script>
  <script src="js/ui/pumps-view.js"></script>
  <script src="js/ui/shop-view.js"></script>
  <script src="js/ui/automat-view.js"></script>
  <script src="js/ui/terminal-view.js"></script>
  <script src="js/ui/traffic-view.js"></script>
  <script src="js/ui/pos.js"></script>
  <script src="js/ui/admin.js"></script>
  <script src="js/ui/pwa.js"></script>
  <script src="js/ui/app.js"></script>
</body>
</html>
